<div class="product bg-white p-2">
  <div class="product_image cursor-pointer bg-[#F1F1F1] rounded-md w-full mb-2 relative">
    <div [routerLink]="['/products', product().id]" class="image h-[300px]">
      <img [src]="product().imageCover" loading="lazy" class="w-full h-full object-contain" alt="product-image" />
    </div>
    <button (click)="toggleWishlist(product().id)" class="size-10 rounded-full bg-white absolute top-4 right-4 flex justify-center items-center z-10 cursor-pointer">
      <i class="fa-solid fa-heart text-xl" [class]="{
        'text-main': isInWishlist(product().id),
        'text-black': !isInWishlist(product().id)
      }"></i>
    </button>
  </div>
  <div class="product_content p-2 flex flex-col gap-2">
    <h3 class="text-2xl text-secondary line-clamp-1"> {{product().title}} </h3>
    <div class="flex items-center gap-1.5">
      <i class="fa-solid fa-star text-yellow-600"></i>
      <span class="text-secondary"> {{product().ratingsAverage}} </span>
      <span class="text-gray-300 text-sm">(500+)</span>
    </div>
    <div class="flex justify-between items-center">
      <span class="text-main"> {{product().price}} EGP </span>
      <button (click)="addToCart(product()._id)" class="w-8 h-8 bg-main text-white rounded-md cursor-pointer">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </div>
</div>
