<section>
  <div class="flex h-screen">
    <div class="col w-full md:w-1/2 flex flex-col justify-center px-8 sm:px-10 lg:px-14 xl:px-16 2xl:px-20">
      <div class="main_title flex flex-col gap-2 mb-4">
        <h2 class="text-secondary text-3xl font-bold">Create a Account</h2>
        <p class="text-gray-400 text-sm">Create a new account</p>
      </div>
      <form [formGroup]="form" (ngSubmit)="submitForm()" class="flex flex-col gap-5">
        <app-basic-input
          [id]="'name'"
          [type]="'text'"
          [label]="'Name'"
          [control]="form.get('name')"
          formControlName="name"
          [errors]="{
            'required': 'name is required'
          }"
        />
        <app-basic-input
          [id]="'email'"
          [type]="'email'"
          [label]="'Email'"
          [control]="form.get('email')"
          formControlName="email"
          [errors]="{
            'required': 'email is required',
            'email': 'enter valid email'
          }"
        />
        <app-basic-input
          [id]="'password'"
          [label]="'Password'"
          [control]="form.get('password')"
          formControlName="password"
          [maskPassword]="true"
          [errors]="{
            'required': 'password is required',
            'pattern': 'Password must start with upperCase then any 6 chars or more'
          }"
        />
        <app-basic-input
          [id]="'rePassword'"
          [label]="'Confirm Password'"
          [control]="form.get('rePassword')"
          formControlName="rePassword"
          [maskPassword]="true"
          [errors]="{
            'required': 'confirm Password is required',
            'mismatch': 'Password and confirmPassword dosen\'t match'
          }"
        />
        <app-basic-input
          [id]="'phone'"
          [type]="'tel'"
          [label]="'Phone'"
          [control]="form.get('phone')"
          formControlName="phone"
          [errors]="{
            'required': 'phone is required',
            'pattern': 'accept only egypt phone'
          }"
        />
        <button type="submit" class="btn"> Register </button>
      </form>
      <p class="mt-2.5 text-center">
        Already have an account ?
        <a routerLink="/auth/login" class="text-main underline cursor-pointer">Login</a>
      </p>
    </div>
    <app-auth-slider class="hidden w-1/2 md:block" />
  </div>
</section>
