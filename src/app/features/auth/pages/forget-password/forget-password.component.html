<section class="forget_page">
  <div class="flex h-screen items-center">
    @if (steps() === 'forget') {
      <app-forget-form class="w-full md:w-1/2" (nextStep)="steps.set('otp')" />
    }
    @if (steps() === 'otp') {
      <app-otp-form class="w-full md:w-1/2" (nextStep)="steps.set('reset')" />
    }
    @if (steps() === 'reset') {
      <app-reset-form class="w-full md:w-1/2" />
    }
    <app-auth-slider class="hidden w-1/2 md:block" />
  </div>
</section>
