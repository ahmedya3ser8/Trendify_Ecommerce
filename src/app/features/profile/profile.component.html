<section class="mt-16 py-14 w-full lg:max-w-4xl mx-auto">
  <div class="container bg-white py-10 px-10 rounded-lg">
    <h2 class="text-2xl text-secondary font-medium mb-6">Personal Information</h2>
    <app-profile-form (openModal)="openChangePassModal.set(true)" />
  </div>
</section>

@if (openChangePassModal()) {
  <app-change-password-modal
    (closeModal)="openChangePassModal.set(false)"
  />
}
