<div class="fixed inset-0 bg-black/50 flex justify-center items-center z-9999">
  <div class="bg-white p-5 w-[95%] md:w-md flex flex-col gap-6">
    <button (click)="closeModal.emit()" class="ml-auto">
      <i class="fa-regular fa-circle-xmark text-secondary text-2xl cursor-pointer"></i>
    </button>
    <h3 class="text-secondary text-xl font-medium text-center">Change Password</h3>
    <form [formGroup]="form" (ngSubmit)="submitForm()" class="flex flex-col gap-4">
      <app-input
        [id]="'currentPassword'"
        [label]="'Current Password'"
        [control]="form.get('currentPassword')"
        formControlName="currentPassword"
        [maskPassword]="true"
        [errors]="{
          'required': 'current Password is required'
        }"
      />
      <app-input
        [id]="'newPassword'"
        [label]="'Password'"
        [control]="form.get('password')"
        formControlName="password"
        [maskPassword]="true"
        [errors]="{
          'required': 'Password is required',
          'pattern': 'Password must start with upperCase then any 6 chars or more'
        }"
      />
      <app-input
        [id]="'rePassword'"
        [label]="'Confirm Password'"
        [control]="form.get('rePassword')"
        formControlName="rePassword"
        [maskPassword]="true"
        [errors]="{
          'required': 'confirm Password is required',
          'mismatch': 'Password and confirmPassword dosen\'t match'
        }"
      />
      <button type="submit" class="btn_primary rounded-lg">Change</button>
    </form>
  </div>
</div>
