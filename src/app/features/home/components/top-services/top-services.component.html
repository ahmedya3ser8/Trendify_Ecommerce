<section class="services py-14">
  <div class="container">
    <app-main-title
      [title]="'Services'"
      [description]="'Benefits when using <br/> our services'"
    />
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (item of servicesItems(); track $index) {
        <div class="card bg-white rounded-lg flex flex-col gap-3 p-6">
          <span class="size-12 rounded-full bg-[#f6f6f6] flex justify-center items-center">
            <i [class]="item.icon"></i>
          </span>
          <h3 class="text-secondary text-lg font-medium">{{item.title}}</h3>
          <p class="text-gray-400 text-sm md:text-base"> {{item.description}} </p>
        </div>
      }
    </div>
  </div>
</section>
