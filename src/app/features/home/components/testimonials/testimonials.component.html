<section class="py-14">
  <div class="container">
    <app-main-title
      [title]="'Testimonials'"
      [description]="'What Our Customer Say'"
    />
    <div class="grid grid-cols-3 gap-6">
      @for (item of testimonilasItems(); track $index) {
        <div class="col bg-white p-5 rounded-md shadow flex flex-col gap-4">
          <span class="text-4xl text-main">
            <i class="fa-solid fa-quote-left"></i>
          </span>
          <p class="text-gray-300"> {{item.description}} </p>
          <div class="flex items-center gap-3">
            <div class="image">
              <img src="/images/customer.png" class="size-10 rounded-full" alt="customer" />
            </div>
            <div class="flex-1 flex justify-between items-center">
              <h3 class="text-secondary font-medium text-lg"> {{item.userName}} </h3>
              <div class="star">
                <i class="fa-solid fa-star text-yellow-600"></i>
                {{item.rate}}
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
